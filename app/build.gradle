plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'org.siongdict.app'
    compileSdk 35

    defaultConfig {
        applicationId "org.siongdict.app"
        minSdk 24
        targetSdk 35
        versionCode 46
        versionName "0.4-rc.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    // 只用 Icons.Default.*（图标核心集）；两个扩展图标已内联到 ui/icons/SiongIcons.kt，
    // 因此不再需要 material-icons-extended（AAR 约 34 MB）。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'com.github.requery:sqlite-android:3.49.0'

    // ── 回归测试（只进 androidTest / debug APK，不影响对外发布的 APK）──
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
